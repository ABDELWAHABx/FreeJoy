name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client
        run: npm ci
        working-directory: client
      - name: Test client session lifecycle
        run: npm test
        working-directory: client
      - name: Typecheck client
        run: npm run typecheck
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Audit client
        run: npm audit --audit-level=moderate
        working-directory: client
      - name: Install server
        run: npm ci
        working-directory: server
      - name: Build server
        run: npm run build
        working-directory: server
      - name: Test server
        run: npm test
        working-directory: server
      - name: Smoke-test server package
        run: npm run package:smoke
        working-directory: server
      - name: Audit server
        run: npm audit --audit-level=moderate
        working-directory: server
